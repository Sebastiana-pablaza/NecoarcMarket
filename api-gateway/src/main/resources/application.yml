server:
  port: ${PORT:8090}

spring:
  application:
    name: api-gateway
  profiles:
    active: dev

---

spring:
  config:
    activate:
      on-profile: dev, prod

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            #Microservicio de Usuarios
            - id: ms-usuario-route
              uri: ${USUARIO_SERVICE_URL:http://usuario:8080}
              predicates:
                - Path=/v1/usuario/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Productos
            - id: ms-productos-route
              uri: ${PRODUCTOS_SERVICE_URL:http://producto-service:8081}
              predicates:
                - Path=/v1/productos/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Inventario 
            - id: ms-inventario-route
              uri: ${INVENTARIO_SERVICE_URL:http://inventario-service:8082}
              predicates:
                - Path=/v1/inventario/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Búsqueda
            - id: ms-busqueda-route
              uri: ${BUSQUEDA_SERVICE_URL:http://ms-busqueda:8083}
              predicates:
                - Path=/v1/busqueda/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Envío
            - id: ms-envio-route
              uri: ${ENVIO_SERVICE_URL:http://envio-service:8084}
              predicates:
                - Path=/v1/envio/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Notificaciones
            - id: ms-notificacion-route
              uri: ${NOTIFICACION_SERVICE_URL:http://notificacion-service:8085}
              predicates:
                - Path=/v1/notificaciones/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Reseñas
            - id: ms-resena-route
              uri: ${RESENA_SERVICE_URL:http://resena-service:8086}
              predicates:
                - Path=/v1/resenas/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Carrito
            - id: ms-carrito-route
              uri: ${CARRITO_SERVICE_URL:http://carrito-service:8087}
              predicates:
                - Path=/v1/carrito/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Órdenes
            - id: ms-ordenes-route
              uri: ${ORDENES_SERVICE_URL:http://ordenes-service:8088}
              predicates:
                - Path=/v1/ordenes/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

            #Microservicio de Pagos
            - id: ms-pagos-route
              uri: ${PAGOS_SERVICE_URL:http://pagos-service:8092}
              predicates:
                - Path=/v1/pagos/**
              filters:
                - AddRequestHeader=X-Gateway-Source, api-gateway

springdoc:
  enable-native-support: true
  swagger-ui:
    urls:
      - name: 01. Usuarios
        url: /v1/usuario/v3/api-docs
      - name: 02. Productos
        url: /v1/productos/v3/api-docs
      - name: 03. Inventario
        url: /v1/inventario/v3/api-docs
      - name: 04. Búsqueda
        url: /v1/busqueda/v3/api-docs
      - name: 05. Envío
        url: /v1/envio/v3/api-docs
      - name: 06. Notificaciones
        url: /v1/notificaciones/v3/api-docs
      - name: 07. Reseñas
        url: /v1/resenas/v3/api-docs
      - name: 08. Carrito
        url: /v1/carrito/v3/api-docs
      - name: 09. Órdenes
        url: /v1/ordenes/v3/api-docs
      - name: 10. Pagos
        url: /v1/pagos/v3/api-docs